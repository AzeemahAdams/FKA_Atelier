<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — FKA Atelier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">

  <!-- Supabase + config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../fka-config.js"></script>
</head>
<body data-root="../">

<div class="adm-login-page">
  <div class="adm-login-box">
    <div class="adm-login-brand">
      <span class="adm-login-brand-name">FKA Atelier</span>
      <span class="adm-login-brand-sub">Store Administration</span>
    </div>
    <p class="adm-login-title">Sign in to your dashboard</p>

    <div class="adm-login-error" id="login-error" style="display:none;"></div>

    <div id="session-notice" class="adm-login-error"
      style="background:#FEF3C7;border-color:#FCD34D;color:#92400E;display:none;">
      <i class="fa-regular fa-clock"></i> Your session expired. Please sign in again.
    </div>

    <form id="login-form" novalidate>
      <div class="adm-field" style="margin-bottom:1.1rem;">
        <label class="adm-label" for="adm-email">Email Address</label>
        <input class="adm-input" type="email" id="adm-email"
          placeholder="admin@fkaatelier.com"
          autocomplete="username" required autofocus>
      </div>
      <div class="adm-field" style="margin-bottom:0.5rem;">
        <label class="adm-label" for="adm-password">Password</label>
        <div style="position:relative;">
          <input class="adm-input" type="password" id="adm-password"
            placeholder="••••••••"
            autocomplete="current-password" required style="padding-right:2.75rem;">
          <button type="button" id="toggle-pw" aria-label="Show password"
            style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);
                   background:none;border:none;color:#9A9A9A;cursor:pointer;font-size:0.9rem;">
            <i class="fa-regular fa-eye" id="pw-icon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="adm-login-btn" id="login-btn">
        <i class="fa-regular fa-right-to-bracket"></i> Sign In
      </button>
    </form>

    <p class="adm-login-hint" id="login-hint">
      <span id="hint-supabase" style="display:none;">
        Sign in with your Supabase admin email.
      </span>
      <span id="hint-fallback">
        Default credentials: <strong>admin</strong> / <strong>admin123</strong><br>
        Change these in Settings after first login.<br>
        <small style="color:#9A9A9A;">(To use Supabase Auth, add your credentials to <code>fka-config.js</code>)</small>
      </span>
    </p>
  </div>
</div>

<script src="../assets/js/supabase.js"></script>
<script src="../assets/js/orders.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
"use strict";

// Show correct hint based on whether Supabase is configured
(function() {
  const url = window.FKA_CONFIG?.supabaseUrl || "";
  const isConfigured = url !== "YOUR_SUPABASE_URL" && url.startsWith("https://");
  document.getElementById("hint-supabase").style.display  = isConfigured ? "block" : "none";
  document.getElementById("hint-fallback").style.display  = isConfigured ? "none"  : "block";
  // Update placeholder based on mode
  if (isConfigured) {
    document.getElementById("adm-email").placeholder = "admin@yoursite.com";
  } else {
    document.getElementById("adm-email").placeholder = "admin (or your username)";
  }
})();

// Init auth listener only when Supabase is configured
if (typeof initAuthListener === "function") {
  try { initAuthListener(); } catch(e) { console.warn("Auth listener:", e.message); }
}

// If already logged in, go straight to dashboard
(async () => {
  try {
    await new Promise(r => setTimeout(r, 300));
    if (adminIsLoggedIn()) {
      window.location.href = "dashboard.html";
      return;
    }
  } catch(e) {}

  // Show session-expired notice if redirected here
  const params = new URLSearchParams(window.location.search);
  if (params.get("reason") === "session") {
    document.getElementById("session-notice").style.display = "block";
  }
})();

// Password visibility toggle
document.getElementById("toggle-pw").addEventListener("click", () => {
  const pw   = document.getElementById("adm-password");
  const icon = document.getElementById("pw-icon");
  if (pw.type === "password") { pw.type = "text";     icon.className = "fa-regular fa-eye-slash"; }
  else                        { pw.type = "password"; icon.className = "fa-regular fa-eye"; }
});

// Login form
document.getElementById("login-form").addEventListener("submit", async e => {
  e.preventDefault();
  const email    = document.getElementById("adm-email").value.trim();
  const password = document.getElementById("adm-password").value;
  const errEl    = document.getElementById("login-error");
  const btn      = document.getElementById("login-btn");

  if (!email || !password) {
    errEl.textContent   = "Please enter your username/email and password.";
    errEl.style.display = "flex";
    return;
  }

  errEl.style.display = "none";
  btn.disabled    = true;
  btn.innerHTML   = '<i class="fa-regular fa-spinner fa-spin"></i> Signing in…';

  try {
    const result = await adminLoginSupabase(email, password);
    if (result.ok) {
      window.location.href = "dashboard.html";
    } else {
      errEl.textContent    = result.error || "Invalid credentials. Please try again.";
      errEl.style.display  = "flex";
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-regular fa-right-to-bracket"></i> Sign In';
      document.getElementById("adm-password").value = "";
      document.getElementById("adm-password").focus();
    }
  } catch(err) {
    errEl.textContent   = "Something went wrong: " + (err.message || "Please try again.");
    errEl.style.display = "flex";
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-regular fa-right-to-bracket"></i> Sign In';
  }
});
</script>
</body>
</html>
